<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1c2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="פרטים">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>כרטיס פרטים</title>
</head>
<body>
<main>
  <h1>כרטיס פרטים</h1>
  <p class="sub">מקלידים פרט, מציגים אותו לפקיד ומוחקים. שום דבר לא נשמר בטלפון.</p>

  <label for="title-input">כותרת (לא חובה)</label>
  <input id="title-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="למשל: ת.ז.">

  <label for="value-input">הפרט</label>
  <input id="value-input" type="password" dir="ltr" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="row tight">
    <button type="button" id="toggle-visible" class="secondary small">הצגת ההקלדה</button>
    <button type="button" id="toggle-keyboard" class="secondary small">מקלדת אותיות</button>
  </div>

  <label for="show-last">ספרות גלויות לפני החזקת האצבע</label>
  <select id="show-last">
    <option value="0" selected>הכול מוסתר</option>
    <option value="2">2 אחרונות גלויות</option>
    <option value="3">3 אחרונות גלויות</option>
    <option value="4">4 אחרונות גלויות</option>
  </select>

  <p class="error" id="error" role="alert"></p>

  <div class="row">
    <button type="button" id="show-btn">הצגה</button>
    <button type="button" id="clear-btn" class="danger">מחיקה</button>
  </div>

  <p class="hint">הפרט נמחק גם כשסוגרים את הדף או עוברים לאפליקציה אחרת.</p>
</main>

<div id="overlay" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="o-label">
  <div id="o-label" class="o-label"></div>
  <div id="o-area" class="o-area" tabindex="0">
    <div id="o-value" class="o-value" dir="ltr"></div>
  </div>
  <p class="o-hint">מחזיקים את האצבע על המסגרת כדי להציג את כל הפרט</p>
  <div class="row">
    <button type="button" id="o-back" class="secondary-light">חזרה</button>
    <button type="button" id="o-clear" class="danger">מחיקה</button>
  </div>
</div>

<noscript><p class="error">הדף צריך JavaScript כדי לעבוד.</p></noscript>
<script src="app.js"></script>
</body>
</html>
