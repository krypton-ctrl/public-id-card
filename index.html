<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1c2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="פרטים">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>כרטיס פרטים</title>
</head>
<body>
<main id="edit-screen">
  <h1>כרטיס פרטים</h1>
  <p class="sub">מוסיפים פריטים, מציגים את הכרטיס לפקיד ומוחקים. שום דבר לא נשמר בטלפון.</p>

  <label for="kind">שם הפריט</label>
  <select id="kind">
    <option value="" selected disabled>בחירת פריט</option>
    <option value="id">תעודת זהות</option>
    <option value="phone">טלפון</option>
    <option value="address">כתובת</option>
    <option value="other">אחר</option>
  </select>

  <div id="custom-wrap" hidden>
    <label for="custom-name">שם לפריט</label>
    <input id="custom-name" type="text" enterkeyhint="next" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="למשל: מספר לקוח">
  </div>

  <label for="value-input">הערך</label>
  <input id="value-input" type="text" dir="auto" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button type="button" id="toggle-keyboard" class="secondary small">מקלדת אותיות</button>

  <p class="limit" id="limit-msg" hidden>הגעת למקסימום של 4 פריטים. כדי להוסיף פריט אחר, צריך קודם להסיר אחד מהרשימה.</p>
  <p class="error" id="error" role="alert"></p>

  <div class="row">
    <button type="button" id="add-btn">הוספה</button>
    <button type="button" id="cancel-edit" class="secondary" hidden>ביטול עריכה</button>
  </div>

  <h2 id="list-title" hidden>פריטים בכרטיס</h2>
  <div id="items"></div>

  <div class="row">
    <button type="button" id="show-card">הצגת כרטיס</button>
    <button type="button" id="clear-btn" class="danger">מחיקה</button>
  </div>

  <p class="hint">הכול נמחק גם כשסוגרים את הדף או עוברים לאפליקציה אחרת.</p>
</main>

<div id="card-screen" class="stage" hidden role="dialog" aria-modal="true" aria-label="כרטיס פרטים">
  <div id="card-items" class="card-items"></div>
  <div class="card-actions">
    <button type="button" id="toggle-hide">הסתרה</button>
    <button type="button" id="back-btn" class="dark">חזרה</button>
    <button type="button" id="card-clear" class="danger">מחיקה</button>
  </div>
</div>

<noscript><p class="error">הדף צריך JavaScript כדי לעבוד.</p></noscript>
<script src="app.js"></script>
</body>
</html>
